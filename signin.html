<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#243b2d"><title>Sign in · Common Ground</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px;background:#e8e8df;color:#22281f;font:15px system-ui}.card{width:min(430px,100%);padding:32px;background:#f8f5ee;border:1px solid #ded9ce;border-radius:18px;box-shadow:0 20px 60px #17251b20}.brand{font-weight:800}.mark{display:inline-grid;place-items:center;width:34px;height:34px;margin-right:8px;border-radius:9px;background:#243b2d;color:#d9ed7c;font:23px Georgia}.eyebrow{margin-top:32px;color:#778251;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{font:600 34px Georgia;margin:10px 0}.muted{color:#77796d;line-height:1.65;font-size:14px}label{display:block;margin:24px 0 8px;font-size:12px;font-weight:700}input{width:100%;padding:15px;border:1px solid #d4d2c7;border-radius:9px;background:#fffdf8;font:16px system-ui}button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:9px;background:#243b2d;color:white;font-weight:750}#message{min-height:45px;margin-top:14px;color:#596c3f;font-size:13px;line-height:1.55}.back{display:block;text-align:center;margin-top:18px;color:#697750;text-decoration:none;font-size:13px}</style><body><main class="card"><div class="brand"><span class="mark">C</span> common ground</div><div class="eyebrow">Your study room, wherever you are</div><h1>Welcome back.</h1><p class="muted">Sign in with your email. We’ll send a secure one-time link so your reading place and learning progress can follow you between devices.</p><form id="form"><label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com" autocomplete="email" required><button id="submit">Email me a sign-in link</button></form><div id="message" role="status" aria-live="polite"></div><a class="back" href="/">← Back to the audiobook</a></main><script type="module">const $=id=>document.getElementById(id),msg=$("message"),btn=$("submit");try{const {createClient}=await import("https://esm.sh/@supabase/supabase-js@2");const sb=createClient("https://xapbabumqddskuhuldgh.supabase.co","sb_publishable_HyQl6nhmhIfhfSEUlqDN5Q_a_oZadWE",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data:{session}}=await sb.auth.getSession();if(session){msg.textContent="Signed in as "+session.user.email+". Returning to your audiobook…";$("form").hidden=true;setTimeout(()=>location.replace("/"),1200)}sb.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_IN"&&session){msg.textContent="Sign-in complete. Returning to your audiobook…";setTimeout(()=>location.replace("/"),900)}});$("form").onsubmit=async e=>{e.preventDefault();btn.disabled=true;msg.textContent="Sending your secure sign-in link…";try{const {error}=await sb.auth.signInWithOtp({email:$("email").value.trim(),options:{emailRedirectTo:location.origin+"/signin.html"}});if(error)throw error;msg.textContent="Check your inbox and open the sign-in link on this device. Check spam if it doesn’t arrive."}catch(err){msg.textContent=err.message||"Could not send the link. Please try again."}finally{btn.disabled=false}}}catch(e){msg.textContent="Sign-in is temporarily unavailable. Refresh and try again."}</script></body></html>
